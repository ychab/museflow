  life_phase_insights:
  - Early listening is lyric-centred and rooted in 1990s New York, typical of a student treating albums as curriculum.
  - Mid-2017 brings a sharp energy spike as trap production takes over, with party and aggressive moods dominating.
  - After 2019, melodic and hazy rap suggests a more reflective phase and more late-night listening.
  - 'From 2022, discovery follows beatmakers rather than rappers: jazz samples, loops and instrumentals gain ground.'
  - Since mid-2024, UK drill brings back intensity while keeping the sample-hunting habit alive.
