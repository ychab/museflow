[project]
site_url = "https://ychab.github.io/museflow/"
site_name = "MuseFlow"
site_description = "Rediscover and discover music from your own listening history — a product-minded backend showcase."
site_author = "Yannick Chabbert"

copyright = "Copyright &copy; 2026 Yannick Chabbert"

repo_url = "https://github.com/ychab/museflow"
repo_name = "ychab/museflow"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Product" = [
    { "Overview" = "product/index.md" },
    { "Why MuseFlow" = "product/why.md" },
    { "The V1 → V2 pivot" = "product/pivot.md" },
    { "Product principles" = "product/principles.md" },
    { "What my data taught me" = "product/insights.md" },
    { "Business model sketch" = "product/business-model.md" },
    { "Lessons learned" = "product/lessons-learned.md" },
    { "Example taste profiles" = "product/examples/index.md" }
  ] },
  { "User guide" = [
    { "Getting started" = "user-guide/index.md" },
    { "Spotify data export" = "user-guide/spotify-data-export.md" },
    { "Commands" = [
      { "`users`" = "user-guide/commands/users.md" },
      { "`spotify`" = "user-guide/commands/spotify.md" },
      { "`tracks`" = "user-guide/commands/tracks.md" },
      { "`taste`" = "user-guide/commands/taste.md" },
      { "`playlist`" = "user-guide/commands/playlist.md" },
      { "`rate`" = "user-guide/commands/rate.md" },
      { "`blacklist`" = "user-guide/commands/blacklist.md" },
      { "`enrich`" = "user-guide/commands/enrich.md" },
      { "`stats`" = "user-guide/commands/stats.md" }
    ] },
    { "Recipes" = "user-guide/recipes.md" }
  ] },
  { "Technical" = [
    { "Overview" = "technical/index.md" },
    { "Architecture" = "technical/architecture.md" },
    { "Unit of work" = "technical/unit-of-work.md" },
    { "Data model" = "technical/data-model.md" },
    { "LLM pipeline" = "technical/llm-pipeline.md" },
    { "Privacy & data" = "technical/privacy-and-data.md" },
    { "Quality & testing" = "technical/quality.md" },
    { "AI-assisted development" = "technical/ai-assisted-development.md" },
    { "Contributing" = "technical/contributing.md" }
  ] },
]

# extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# [[project.extra.social]]
# icon = "fontawesome/brands/github"
# link = "https://github.com/user/repo"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
